name: CI

on:
  push:
    # Match the branch conventions this repo actually uses (CLAUDE.md):
    # phase-N/…, plus Conventional-Commit-style feat/fix/docs/chore branches.
    # The old `develop`/`feature/*` globs never matched, so pushes to working
    # branches ran no CI until the PR was opened.
    branches:
      - main
      - 'phase-*/**'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run build
