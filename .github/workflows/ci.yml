name: CI

on:
  # Push only on main: feature branches get their run from the PR, so also
  # listening to branch pushes ran the same CI twice per commit (#334).
  push:
    branches: [main]
  # ready_for_review: a draft PR's required jobs FAIL on purpose ("full CI has
  # not run"), so a draft can never leave a green required check behind;
  # marking ready starts the full CI. The SHA does not change when marking
  # ready, so wait for the new run to finish before merging (AGENTS.md).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One run per PR: a new push cancels the in-flight run instead of queueing N
# parallel runs. Runs on main are never cancelled in progress; with the default
# queue behaviour a newer main run replaces one still *pending* (intermediate
# runs are dropped, the latest always runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: read feeds the budget breaker (scripts/ci-budget.mjs); pull-requests:
# read lets it look for the ci:override label. Nothing here can write.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  # Decides whether the heavy steps are needed. Fail-safe: the heavy jobs gate
  # on `!= 'false'`, so a failed/skipped/unknown result still runs them. Docs-
  # only diffs get heavy=false; drafts get draft=true, which makes every
  # required job fail. Every job below still REPORTS (required checks are
  # green-by-running, never green-by-skipping).
  # PR-only: on push to main it would cost a billed minute to always say
  # "heavy"; skipped, the empty output still runs everything (`!= 'false'`).
  changes:
    name: Changes gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
      draft: ${{ steps.gate.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - id: gate
        run: node scripts/ci-changes.mjs
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}

  build:
    name: Build & Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: CI budget breaker (fails, never skips, when over the daily limit)
        # FIRST step after checkout on purpose: a job skipped by `if` reports
        # success and would satisfy a required check; a failing step cannot.
        # Fails open (warning) on API errors. See docs/runbooks/ci-cost.md.
        run: node scripts/ci-budget.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_DAILY_RUN_LIMIT: ${{ vars.CI_DAILY_RUN_LIMIT || '50' }}
      - name: Draft PR - full CI has not run
        # A draft must not leave a passing required check: marking ready keeps
        # the same SHA, so a green draft check would be mergeable with no tests.
        if: ${{ !cancelled() && needs.changes.outputs.draft == 'true' }}
        run: |
          echo "::error::Draft: full CI has not run; mark the PR ready for review"
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
      - run: npm ci
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
      # `check` already ends with a full build (npm-run-all --serial build),
      # so no separate build step — the old duplicate cost ~3-4 min per run.
      #
      # DEGRADATION PATH (see docs/SETUP.md — "astro check scale fallback"):
      # At large content-tree scale, `astro check` can OOM. Set the
      # CHECK_SKIP_ASTRO=1 env var as a repo/environment secret to fall back
      # to `tsc --noEmit` + `npm run build` instead. The step below picks this
      # up automatically.
      - name: Check (astro check + build, or tsc fallback)
        run: |
          if [ "$CHECK_SKIP_ASTRO" = "1" ]; then
            echo "::warning::CHECK_SKIP_ASTRO=1 — running tsc --noEmit + build instead of astro check (OOM escape hatch)"
            npm run type-check
            npm run build
          else
            npm run check
          fi
        env:
          CHECK_SKIP_ASTRO: ${{ vars.CHECK_SKIP_ASTRO || '' }}
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}

  # ---------------------------------------------------------------------------
  # actionlint — static analysis for all workflow files
  #
  # Catches the class of bug found in Watchboard (#168):
  #   - env var conditions that always evaluate false
  #   - mutable `uses: action@main` refs among pinned `@v1` refs
  #   - unquoted ${{ inputs.* }} interpolations in run: blocks
  #   - invalid event names / step syntax
  #
  # We download the binary directly (SHA-pinned version + checksum) rather
  # than using an Action wrapper, so the only third-party code running here
  # is the pinned actionlint binary itself.
  #
  # Lighthouse budgets deferral note:
  #   `npm run lighthouse` requires a running preview server which in turn
  #   requires a separate port-forward, a long cold boot, and produces flaky
  #   results against a synthetic preview in CI. The budget file
  #   (lighthouse-budgets.json) is enforced locally and in the dev workflow.
  #   Once the project has a stable staging URL, add a lighthouse-ci job that
  #   runs `lhci autorun` against that URL (not a locally-started server).
  #   Tracking: #168.
  #
  # axe a11y smoke note:
  #   The axe/Playwright smoke lives in visual.yml (one AxeBuilder scan per
  #   smoke route, failing on serious/critical). Since #334 that workflow runs
  #   on dispatch and weekly, NOT on every PR, so there is no per-PR a11y gate:
  #   dispatch it before merging UI changes. Wiring a duplicate here would
  #   double the cost.
  # ---------------------------------------------------------------------------
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: CI budget breaker (fails, never skips, when over the daily limit)
        # FIRST step after checkout on purpose: a job skipped by `if` reports
        # success and would satisfy a required check; a failing step cannot.
        # Fails open (warning) on API errors. See docs/runbooks/ci-cost.md.
        run: node scripts/ci-budget.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_DAILY_RUN_LIMIT: ${{ vars.CI_DAILY_RUN_LIMIT || '50' }}
      - name: Draft PR - full CI has not run
        # A draft must not leave a passing required check: marking ready keeps
        # the same SHA, so a green draft check would be mergeable with no tests.
        if: ${{ !cancelled() && needs.changes.outputs.draft == 'true' }}
        run: |
          echo "::error::Draft: full CI has not run; mark the PR ready for review"
          exit 1

      - name: Download actionlint v1.7.12 (SHA-pinned)
        # The SHA is the sha256 of actionlint_1.7.12_linux_amd64.tar.gz,
        # taken from the official checksums file published with the release.
        # Update this comment + the checksum when bumping the version.
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: |
          ./actionlint -color .github/workflows/*.yml

      - name: Scan for unpinned third-party action refs (mutable @branch refs)
        # Flags `uses: owner/repo@main` or `@master` — mutable refs that can
        # be silently updated. SHA pins are required for all third-party actions.
        # First-party `actions/*` are trusted runners; they can use @vN tags.
        run: |
          # BUGFIX: the original pattern used a PCRE negative-lookahead
          # `(?!...)`, which GNU `grep -E` (POSIX ERE) does not support — so it
          # never matched and this security scan silently never ran. The form
          # below is valid ERE: it flags any third-party `uses:` ref that is
          # NOT pinned to a 40-hex commit SHA. First-party actions/* and
          # github/*, and local ./ refs, are exempt.
          #
          # Use `-rn` (file + line numbers), not `-rh`: on failure the report
          # must say WHICH workflow and line holds the unpinned ref so it's
          # actionable without a manual search. The `file:line:` prefix does
          # not affect the filters below — the first-party check matches on the
          # `uses:` token and the SHA check is `$`-anchored on the trailing ref.
          UNPINNED=$(grep -rnE "^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+" \
              .github/workflows/*.yml \
            | sed -E 's/#.*$//' \
            | grep -vE "uses:[[:space:]]+(actions/|github/|\\./)" \
            | grep -vE "@[0-9a-f]{40}[[:space:]]*$" \
            || true)
          if [ -n "$UNPINNED" ]; then
            echo "ERROR: unpinned third-party action refs found:"
            echo "$UNPINNED"
            exit 1
          fi
          echo "OK: all third-party action refs appear to be SHA-pinned."

  server-node:
    name: server-node tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: CI budget breaker (fails, never skips, when over the daily limit)
        # FIRST step after checkout on purpose: a job skipped by `if` reports
        # success and would satisfy a required check; a failing step cannot.
        # Fails open (warning) on API errors. See docs/runbooks/ci-cost.md.
        run: node scripts/ci-budget.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_DAILY_RUN_LIMIT: ${{ vars.CI_DAILY_RUN_LIMIT || '50' }}
      - name: Draft PR - full CI has not run
        # A draft must not leave a passing required check: marking ready keeps
        # the same SHA, so a green draft check would be mergeable with no tests.
        if: ${{ !cancelled() && needs.changes.outputs.draft == 'true' }}
        run: |
          echo "::error::Draft: full CI has not run; mark the PR ready for review"
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server-node/package-lock.json
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
      - run: npm ci
        working-directory: server-node
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
      - run: npm test
        working-directory: server-node
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}

  server-flask:
    name: server-flask tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: CI budget breaker (fails, never skips, when over the daily limit)
        # FIRST step after checkout on purpose: a job skipped by `if` reports
        # success and would satisfy a required check; a failing step cannot.
        # Fails open (warning) on API errors. See docs/runbooks/ci-cost.md.
        run: node scripts/ci-budget.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_DAILY_RUN_LIMIT: ${{ vars.CI_DAILY_RUN_LIMIT || '50' }}
      - name: Draft PR - full CI has not run
        # A draft must not leave a passing required check: marking ready keeps
        # the same SHA, so a green draft check would be mergeable with no tests.
        if: ${{ !cancelled() && needs.changes.outputs.draft == 'true' }}
        run: |
          echo "::error::Draft: full CI has not run; mark the PR ready for review"
          exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server-flask/requirements-dev.txt
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
      - run: pip install -r requirements-dev.txt
        working-directory: server-flask
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
      - run: pytest
        working-directory: server-flask
        if: ${{ success() && needs.changes.outputs.heavy != 'false' }}
