name: Tauri Android build/sign/upload

# workflow_dispatch: build verification only, never uploads and never signs
#   with the release key. It does publish two INSTALLABLE-for-testing run
#   artifacts: the unsigned release APK and a debug-key-signed debug APK
#   (the latter installs on any device with zero secrets configured).
# push tags v[0-9]*: the real release path — build, sign, attach the signed
#   APK + AAB to a GitHub Release for the tag, and (optionally, only when
#   PLAY_SERVICE_ACCOUNT_JSON is set) upload the AAB to Play's internal
#   track. A project that never tags a release never triggers a signed
#   build, keeping this opt-in until actually used.
# See docs/runbooks/tauri-android.md and
# docs/superpowers/specs/2026-08-20-tauri-mobile-android-design.md
# (addendum "2026-09-27 — APK / GitHub Release path").
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

# Workflow default stays read-only. The one job that needs to write (the
# `release` job that creates the GitHub Release) widens it for itself
# only — see its own `permissions:` block below.
permissions:
  contents: read

concurrency:
  group: tauri-android-${{ github.ref }}
  # Deliberate: never cancel an in-flight Play Store upload partway through.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # Consumed by the `release` job so it can skip in lockstep with the
      # opt-in guard below.
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Generate Tauri scaffold for workflow_dispatch self-test
        # Makes the workflow self-testable via `gh workflow run
        # tauri-android.yml` even though src-tauri/ isn't committed to this
        # repo (Tauri projects are generated locally/opt-in, never checked
        # in — see the guard step below for the push-event equivalent).
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f src-tauri/tauri.conf.json ]; then
            node scripts/add-tauri.mjs --name "Inceptor Android Smoke" --identifier com.inceptor.androidsmoke
            node scripts/add-tauri-android.mjs
            npm install
          fi

      - name: Skip unless this project has opted into Tauri Android
        # A downstream project that copied this workflow but never ran
        # add-tauri.mjs / add-tauri-android.mjs should get a quiet skip on
        # a normal tag push, not a red/confusing CI failure — opt-in, zero
        # footprint until used. By the time this runs on workflow_dispatch
        # in THIS repo, the self-test step above has already generated the
        # scaffold, so the guard correctly finds it present.
        id: guard
        run: |
          if [ ! -f src-tauri/tauri.conf.json ] || ! jq -e '.bundle.android' src-tauri/tauri.conf.json >/dev/null 2>&1; then
            echo "::notice::No Tauri Android config found — this project hasn't run add-tauri-android.mjs. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches tauri.conf.json version
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$TAG" = "v$VER" ] || { echo "::error::Tag $TAG != v$VER from tauri.conf.json — refusing to release."; exit 1; }

      - name: Validate required signing secrets
        # The four keystore secrets are REQUIRED on a tag push — without
        # them nothing can be signed and there is nothing to release.
        # PLAY_SERVICE_ACCOUNT_JSON is OPTIONAL: the signed APK + AAB are
        # always attached to the GitHub Release, and the Play upload is an
        # extra step layered on top only when a Play listing exists. Since
        # `secrets.*` can't be referenced from an `if:` directly, the
        # decision is surfaced as the step output `play` (true/false) and
        # every Play step below is gated on it.
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: secrets
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets for the release path:$missing"
            echo "::error::See docs/runbooks/tauri-android.md → 'Signing and Play Store release'."
            exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping the Google Play upload. The signed APK and AAB will still be attached to the GitHub Release for this tag. See docs/runbooks/tauri-android.md → 'Installable APK without Google Play'."
            echo "play=false" >> "$GITHUB_OUTPUT"
          else
            echo "play=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Free runner disk space
        # Four Android ABIs x (release + debug) Rust builds need ~20 GB of
        # scratch under src-tauri/target; ubuntu-latest ships with ~14 GB
        # free. The first real run (TradePilot, 2026-09-27) built the AAB
        # and the release APK, then died in the debug build with "No space
        # left on device" and lost both artifacts. Drop toolchains this job
        # never uses (dotnet, Haskell, Swift, CodeQL, boost, docker images).
        if: steps.guard.outputs.skip != 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/lib/google-cloud-sdk 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Setup Java 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.guard.outputs.skip != 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Two platform levels: one for the Gradle/AGP toolchain Tauri's
          # Android template expects, plus whatever satisfies Play's
          # CURRENT minimum targetSdkVersion — re-check
          # https://developer.android.com/google/play/requirements/target-sdk
          # at execution time; this number moves on a rolling basis.
          # build-tools;34.0.0 also provides apksigner/zipalign for the
          # "Sign APK" step — keep BUILD_TOOLS_VERSION there in sync.
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Confirm Rust toolchain and add Android targets
        if: steps.guard.outputs.skip != 'true'
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Cargo registry
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            # src-tauri/target is deliberately NOT cached: four ABIs of
            # release artifacts exceed the 10 GB per-entry cache limit, so the
            # save step only ever wasted minutes; the registry is what pays off.
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install Node deps
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Generate Tauri icons
        # The app icon (launcher icon, adaptive icon layers, splash) is
        # generated from ONE square PNG. Downstream projects point this at
        # their own logo through the repository VARIABLE (not secret)
        # TAURI_ICON_SOURCE (Settings → Secrets and variables → Actions →
        # Variables). Default: the PWA 512px icon every Inceptor project
        # already ships. Must be a square PNG, ≥ 512px (1024px recommended:
        # Play's listing icon and the xxxhdpi launcher tier both upscale
        # anything smaller).
        if: steps.guard.outputs.skip != 'true'
        env:
          TAURI_ICON_SOURCE: ${{ vars.TAURI_ICON_SOURCE || 'public/icons/pwa-512.png' }}
        run: |
          if [ ! -f "$TAURI_ICON_SOURCE" ]; then
            echo "::error::TAURI_ICON_SOURCE='$TAURI_ICON_SOURCE' does not exist. Set the repository variable TAURI_ICON_SOURCE to a square PNG (≥ 512px) committed in this repo, or add public/icons/pwa-512.png."
            exit 1
          fi
          echo "Generating Tauri icons from $TAURI_ICON_SOURCE"
          npx tauri icon "$TAURI_ICON_SOURCE"

      - name: Build Astro frontend
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: Read app identifier from tauri.conf.json
        if: steps.guard.outputs.skip != 'true'
        id: tauri-identifier
        run: |
          ID=$(jq -r .identifier src-tauri/tauri.conf.json)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::Could not read identifier from src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "identifier=$ID" >> "$GITHUB_OUTPUT"
          # Human-friendly file stem for release assets: <product-slug>-<version>.
          NAME=$(jq -r '.productName // .identifier' src-tauri/tauri.conf.json \
            | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          VER=$(jq -r .version src-tauri/tauri.conf.json)
          echo "asset_stem=${NAME:-app}-${VER}" >> "$GITHUB_OUTPUT"

      - name: Initialise Tauri Android project
        if: steps.guard.outputs.skip != 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi
          chmod +x src-tauri/gen/android/gradlew

      - name: Patch targetSdkVersion for current Play Store requirements
        if: steps.guard.outputs.skip != 'true'
        # tauri.conf.json has no targetSdkVersion field (only
        # minSdkVersion) — the generated Gradle project's default may lag
        # Play's rolling minimum target API. Force it explicitly so a
        # Tauri CLI version bump can't silently regress this and get the
        # upload rejected. Re-verify "35" against Play's current
        # requirement (see the Setup Android SDK step's comment above)
        # before relying on this.
        run: |
          GRADLE_FILE=src-tauri/gen/android/app/build.gradle.kts
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/targetSdk = [0-9]\+/targetSdk = 35/' "$GRADLE_FILE"
            grep -n "targetSdk" "$GRADLE_FILE"
          else
            echo "::error::$GRADLE_FILE not found — tauri android init layout may have changed."
            exit 1
          fi

      - name: Build AAB
        if: steps.guard.outputs.skip != 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: npx tauri android build --aab

      - name: Build release APK (unsigned)
        # Same release profile as the AAB, so the Rust artifacts under
        # src-tauri/target are reused — this mostly costs a Gradle
        # assemble. With no signingConfig wired into the generated Gradle
        # project, AGP emits the release APK as *-unsigned.apk (Tauri's CLI
        # resolves either `app-universal-release.apk` or
        # `app-universal-release-unsigned.apk`, whichever exists — see
        # cargo-mobile2's Profile::Release suffixes), which is why the
        # locate step below matches by directory, not by exact filename.
        if: steps.guard.outputs.skip != 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: npx tauri android build --apk

      - name: Locate release APK
        if: steps.guard.outputs.skip != 'true'
        id: apk
        run: |
          MATCHES=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*' -name '*.apk')
          COUNT=$(echo "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one release APK under src-tauri/gen/android/app/build/outputs/apk, found $COUNT:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Found release APK: $MATCHES"
          echo "unsigned_path=$MATCHES" >> "$GITHUB_OUTPUT"

      # Upload the release artifacts BEFORE the debug build: it is the one
      # step that can still fail for resource reasons, and a failure there
      # must not discard an AAB/APK that already built fine.
      - name: Upload unsigned build artifact (workflow_dispatch verification only)
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-android-unsigned-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release APK artifact (workflow_dispatch verification only)
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-android-unsigned-apk
          path: ${{ steps.apk.outputs.unsigned_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Build debug APK (workflow_dispatch verification only)
        # Signed with the Android debug key by AGP itself, so it installs
        # on any device (`adb install`) with zero secrets configured — the
        # "publish an installable APK with no setup" path. Debug profile
        # means a separate Rust debug compile, hence dispatch-only: a tag
        # push already yields a properly signed release APK.
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          # Full DWARF for four ABIs is what filled the disk; line tables keep
          # panics readable at a fraction of the size.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        # arm64 only: this APK exists to be sideloaded on a test phone, and
        # every Android device sold in years is arm64. One ABI = 1/4 of the
        # compile time and disk of the release builds above.
        run: npx tauri android build --apk --debug --target aarch64

      - name: Upload debug APK artifact (workflow_dispatch, installable for testing)
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Everything below only runs on a version-tag push — never on
      # workflow_dispatch, which stops at the artifact uploads above.
      - name: Decode signing keystore
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          (umask 077; echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Sign AAB
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: sign
        env:
          KEYSTORE_PATH: /tmp/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          MATCHES=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*-release.aab')
          COUNT=$(echo "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one release AAB, found $COUNT:"
            echo "$MATCHES"
            exit 1
          fi
          AAB="$MATCHES"
          echo "Found AAB: $AAB"
          # jarsigner (not apksigner) is correct here: unlike installable
          # .apk files, Play-bound .aab bundles don't require the
          # apksigner v2/v3 scheme — a standard JAR signature is
          # sufficient for bundletool/Play to accept.
          # Both passwords are visible on the process command line (e.g.
          # in `ps` output) for the duration of this step — jarsigner has
          # no clean stdin-based alternative for two distinct passwords.
          # Accepted trade-off on an ephemeral GitHub-hosted runner.
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" "$ANDROID_KEY_ALIAS"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        # apksigner (not jarsigner) is REQUIRED for an installable APK:
        # Android 11+ refuses APKs that carry only a v1 JAR signature, and
        # apksigner produces the v2/v3 scheme. It also takes both passwords
        # via `env:` references, so — unlike the jarsigner step above —
        # neither password appears on the process command line.
        # The unsigned release APK is signed in place into a new file
        # (`--out`), leaving the unsigned original untouched.
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: sign-apk
        env:
          KEYSTORE_PATH: /tmp/release.jks
          # Must match the build-tools;<version> package requested in the
          # "Setup Android SDK" step above.
          BUILD_TOOLS_VERSION: 34.0.0
          UNSIGNED_APK: ${{ steps.apk.outputs.unsigned_path }}
          ASSET_STEM: ${{ steps.tauri-identifier.outputs.asset_stem }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          for tool in apksigner zipalign; do
            if [ ! -x "$BUILD_TOOLS/$tool" ]; then
              echo "::error::$BUILD_TOOLS/$tool not found — keep BUILD_TOOLS_VERSION in sync with the 'Setup Android SDK' packages list."
              exit 1
            fi
          done
          OUT_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT_DIR"
          SIGNED="$OUT_DIR/${ASSET_STEM}-android.apk"
          # apksigner must run AFTER zipalign (v2+ signatures cover the
          # whole file). AGP already aligns release APKs; verify, and only
          # re-align into a temp copy if that ever stops being true.
          ALIGNED="$UNSIGNED_APK"
          if ! "$BUILD_TOOLS/zipalign" -c -p 4 "$UNSIGNED_APK" >/dev/null 2>&1; then
            echo "Release APK is not 4-byte aligned — running zipalign first."
            ALIGNED="$RUNNER_TEMP/aligned-unsigned.apk"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED"
          fi
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          echo "Signed APK: $SIGNED"
          echo "apk_path=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Clean up decoded signing keystore
        # A dedicated step (not the tail of "Sign AAB"/"Sign APK") because
        # run: steps default to `bash -eo pipefail` — if a signer itself
        # failed, the signing step would abort before ever reaching an
        # in-step cleanup line, leaving the decoded keystore behind at
        # /tmp/release.jks. always() ensures this runs whether or not
        # signing succeeded. The path is a hardcoded literal (not a step
        # output) so cleanup does not depend on the write step having
        # succeeded far enough to emit one.
        if: always() && steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: shred -u /tmp/release.jks 2>/dev/null || rm -f /tmp/release.jks

      - name: Stage signed release assets
        # One directory with human-friendly names for both the CI archive
        # artifact and the GitHub Release. Runs BEFORE the optional Play
        # upload on purpose: a Play API failure (outage, duplicate
        # versionCode, unreviewed listing) must not prevent the signed
        # APK/AAB from reaching the `release` job. The AAB is COPIED (the
        # Play step below still consumes it from its original path).
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          AAB_PATH: ${{ steps.sign.outputs.aab_path }}
          ASSET_STEM: ${{ steps.tauri-identifier.outputs.asset_stem }}
        run: |
          OUT_DIR="$RUNNER_TEMP/release-assets"
          cp "$AAB_PATH" "$OUT_DIR/${ASSET_STEM}-android.aab"
          (cd "$OUT_DIR" && sha256sum ./*.apk ./*.aab | tee SHA256SUMS.txt)

      - name: Upload signed release assets (CI archive + hand-off to the release job)
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-android-signed
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Write Play service account credentials to a temp file
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.secrets.outputs.play == 'true'
        run: |
          (umask 077; printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-service-account.json)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload to Play Store internal track
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: /tmp/play-service-account.json
          packageName: ${{ steps.tauri-identifier.outputs.identifier }}
          releaseFiles: ${{ steps.sign.outputs.aab_path }}
          track: internal
          status: completed

      - name: Clean up Play service account credentials file
        # Fixed, predictable path (not a step output) so cleanup doesn't
        # depend on the write step having succeeded far enough to emit one.
        # Not gated on the `play` output on purpose: `rm -f` of a file that
        # was never written is a harmless no-op, and an unconditional
        # cleanup can't be skipped by a gating bug.
        if: always() && steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: rm -f /tmp/play-service-account.json

  release:
    # Separate job on purpose: creating a GitHub Release needs
    # `contents: write`, and this is the ONLY place that token scope is
    # granted. The `build` job — which handles the keystore, the Play
    # credentials, npm ci and every third-party toolchain action — keeps
    # the workflow's read-only default. Widening `permissions:` at the
    # workflow level would hand a write token to all of that.
    needs: build
    if: needs.build.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tauri-android-signed
          path: release-assets

      - name: List release assets
        run: ls -la release-assets

      - name: Attach signed APK and AAB to the GitHub Release for this tag
        # Creates the Release if the tag has none yet, otherwise uploads
        # onto the existing one. The .apk is the "install it without Google
        # Play" deliverable (adb install / sideload); the .aab is for anyone
        # uploading to Play by hand.
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87 # v2.0.5
        with:
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
