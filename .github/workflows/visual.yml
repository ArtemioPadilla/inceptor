name: Visual regression

# Cost guardrail (#334): Playwright + browsers is the most expensive job, so it
# no longer runs on every PR push. Run it from the Actions tab (or
# `gh workflow run visual.yml --ref <branch>`) before merging UI changes, and
# weekly on a schedule as the safety net. Scheduled runs are free on public
# repos and cheap elsewhere; see docs/runbooks/ci-cost.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

# One run per ref; a newer dispatch supersedes the in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Astro (required before preview server)
        run: npm run build

      # Gating since 2026-06: baselines are captured in the same Linux image CI
      # uses (scripts/refresh-baselines.sh), so diffs are real regressions.
      - name: Run Playwright visual tests
        id: pw
        run: npx playwright test

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload current snapshots so they can be promoted to baselines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-snapshots
          path: test-results/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 14
