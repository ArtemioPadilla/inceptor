name: Visual regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch (see ci.yml — audit Wave 1b).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Astro (required before preview server)
        run: npm run build

      # Advisory until baselines are regenerated in a matching Ubuntu env.
      # Initial baselines were captured on macOS; system font metrics differ
      # by ~20-50 px in total page height on Ubuntu CI runners, which produces
      # pixel diffs that aren't actual regressions. The fix is to refresh the
      # baselines from a Linux Playwright Docker image (or download the
      # `playwright-snapshots` artifact below and commit it). Once baselines
      # are platform-stable, remove `continue-on-error` to make this a gate.
      # See CONTRIBUTING.md for the refresh workflow.
      - name: Run Playwright visual tests
        id: pw
        continue-on-error: true
        run: npx playwright test

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload current snapshots so they can be promoted to baselines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-snapshots
          path: test-results/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 14
