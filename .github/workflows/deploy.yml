name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Single concurrent deployment — newer pushes cancel older runs in progress
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # When deployed at a project-pages URL like
          # https://<user>.github.io/<repo>/ the site needs to know its base
          # path. Set this secret in repo settings if you go that route.
          # Empty default → root deployment (custom domain or org pages).
          ASTRO_BASE: ${{ secrets.ASTRO_BASE || '' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
