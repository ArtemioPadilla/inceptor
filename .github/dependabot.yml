version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      tooling:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "vitest"
          - "typescript"
          - "prettier"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
